name: Build Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version Tag
        id: version_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.0-snapshot"
          fi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "Building for tag: ${TAG}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run unit tests
        run: |
          flutter test || echo "No tests found or test suite completed (non-blocking)"

      - name: Configure Keystore & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Secrets detected. Decoding upload keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

            cat <<EOF > android/key.properties
storePassword=$KEYSTORE_PASSWORD
keyPassword=$KEY_PASSWORD
keyAlias=$KEY_ALIAS
storeFile=upload-keystore.jks
EOF
            echo "android/key.properties generated for release signing."
          else
            echo "No signing secrets found. Falling back to debug keystore for sideloadable release build."
          fi

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Build Split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Stage and Rename Distribution Artifacts
        run: |
          mkdir -p dist
          TAG="${{ steps.version_tag.outputs.TAG }}"

          # Universal APK
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" "dist/DeepSeekHermes-${TAG}-universal.apk"
          fi

          # ARM64 APK (from split-per-abi)
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "dist/DeepSeekHermes-${TAG}-arm64.apk"
          elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" "dist/DeepSeekHermes-${TAG}-arm64.apk"
          fi

          # Android App Bundle (AAB)
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp "build/app/outputs/bundle/release/app-release.aab" "dist/DeepSeekHermes-${TAG}.aab"
          fi

          echo "Staged artifacts in dist/:"
          ls -la dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHermes-${{ steps.version_tag.outputs.TAG }}
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
